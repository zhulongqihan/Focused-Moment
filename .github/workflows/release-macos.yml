name: macOS Release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:
    inputs:
      tag:
        description: "已有的 GitHub Release tag，例如 v2.3.9"
        required: true
        type: string

permissions:
  contents: write

jobs:
  build-macos:
    name: Build universal macOS app
    runs-on: macos-latest

    steps:
      - name: Checkout release tag
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref_name }}

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Install universal Rust targets
        run: rustup target add aarch64-apple-darwin x86_64-apple-darwin

      - name: Build universal macOS bundles
        run: pnpm tauri build --target universal-apple-darwin

      - name: Upload macOS bundles to the Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          RELEASE_TAG: ${{ github.event.inputs.tag || github.ref_name }}
        shell: bash
        run: |
          set -euo pipefail
          for attempt in {1..30}; do
            if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
              break
            fi
            if [ "$attempt" -eq 30 ]; then
              echo "GitHub Release $RELEASE_TAG was not created in time."
              exit 1
            fi
            sleep 10
          done

          assets=()
          while IFS= read -r -d '' asset; do
            assets+=("$asset")
          done < <(
            find "src-tauri/target/universal-apple-darwin/release/bundle" \
              -type f \( -name "*.dmg" -o -name "*.app.tar.gz" \) -print0
          )
          if [ "${#assets[@]}" -eq 0 ]; then
            echo "No macOS bundle was produced."
            exit 1
          fi
          gh release upload "$RELEASE_TAG" "${assets[@]}" --clobber
