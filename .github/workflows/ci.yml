name: Checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    name: Frontend and Rust checks
    runs-on: windows-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Type check
        run: pnpm check

      - name: Build frontend
        run: pnpm build

      - name: Install Playwright browser
        run: pnpm exec playwright install chromium

      - name: Frontend flow tests
        run: pnpm test:frontend

      - name: Rust format check
        run: cargo fmt --check --manifest-path src-tauri/Cargo.toml

      - name: Rust check
        run: cargo check --locked --manifest-path src-tauri/Cargo.toml

      - name: Rust tests
        run: cargo test --locked --manifest-path src-tauri/Cargo.toml

      - name: Write verification summary
        if: always()
        shell: pwsh
        run: |
          @(
            "### Focused Moment verification",
            "- commit: $env:GITHUB_SHA",
            "- ref: $env:GITHUB_REF",
            "- run: $env:GITHUB_SERVER_URL/$env:GITHUB_REPOSITORY/actions/runs/$env:GITHUB_RUN_ID",
            "- runner: $env:RUNNER_OS / $env:RUNNER_ARCH",
            "- node: $(node --version)",
            "- pnpm: $(pnpm --version)",
            "- rust: $(rustc --version)",
            "- cargo: $(cargo --version)"
          ) | Out-File -FilePath $env:GITHUB_STEP_SUMMARY -Append -Encoding utf8

      - name: Upload Playwright evidence on failure
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: playwright-evidence-${{ github.run_id }}
          path: |
            test-results/
            output/playwright/
            output/qa/
          if-no-files-found: ignore
          retention-days: 14
